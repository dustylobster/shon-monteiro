<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Shon Jamson Monteiro | Video Editor &amp; CGI Artist</title>
  <meta name="description" content="Video editing and CGI portfolio of Shon Jamson Monteiro: brand films, product reels and car CGI.">
  <meta name="theme-color" content="#000000">
  <!-- Link-only: keep this page out of Google and other search engines -->
  <meta name="robots" content="noindex, nofollow, noimageindex">

  <!-- Link preview (WhatsApp, LinkedIn, iMessage). Needs full https:// URLs. -->
  <meta property="og:url" content="https://dustylobster.github.io/shon-monteiro/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Shon Jamson Monteiro | Video Editor &amp; CGI Artist">
  <meta property="og:description" content="Brand films, product reels and CGI. Tap to watch.">
  <meta property="og:image" content="https://dustylobster.github.io/shon-monteiro/media/og.jpg">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23000'/%3E%3Cpath d='M26 20l20 12-20 12z' fill='%23f5f5f7'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="content.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="nav">
    <div class="nav-inner">
      <a class="brand" href="#top"></a>
      <nav class="nav-links" aria-label="Sections">
        <a href="#work">Work</a>
        <a href="#about">About</a>
        <a href="#contact" class="nav-cta">Contact</a>
      </nav>
    </div>
  </header>

  <main id="top">
    <section class="hero">
      <div class="hero-glow" aria-hidden="true"></div>
      <p class="status"><span class="status-dot" aria-hidden="true"></span><span class="status-text"></span></p>
      <p class="eyebrow"></p>
      <h1 class="hero-title"></h1>
      <p class="hero-sub"></p>
      <div class="hero-actions">
        <a class="btn btn-light" href="#reel">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
          Watch the reel
        </a>
        <a class="link-arrow hero-mail" href="#contact">Get in touch</a>
      </div>
      <div class="clients">
        <p class="clients-label">Selected clients</p>
        <ul class="clients-list"></ul>
      </div>
    </section>

    <section class="reel" id="reel">
      <div class="reel-sticky">
        <div class="reel-frame">
          <video class="reel-video" muted loop playsinline preload="metadata"></video>
          <div class="reel-shade" aria-hidden="true"></div>
          <div class="reel-caption">
            <p class="reel-kicker">Showreel</p>
            <h2 class="reel-title"></h2>
            <button class="btn btn-light reel-play" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
              Watch with sound
            </button>
          </div>
        </div>
      </div>
    </section>

    <section class="work" id="work">
      <div class="section-head">
        <h2 class="section-title reveal">Selected work.</h2>
        <nav class="work-nav reveal" aria-label="Work categories"></nav>
      </div>
      <div class="groups"></div>
    </section>

    <section class="about" id="about">
      <p class="about-kicker reveal">About</p>
      <p class="statement"></p>
      <ul class="tools reveal" aria-label="Tools"></ul>
    </section>

    <section class="contact" id="contact">
      <p class="contact-kicker reveal">Contact</p>
      <h2 class="contact-title reveal">Let's make<br>something.</h2>
      <p class="contact-sub reveal">Brand films, product reels, CGI or a recut of your footage. Send me the brief.</p>
      <div class="contact-actions reveal">
        <a class="btn btn-light contact-mail" href="#"></a>
        <button class="btn btn-ghost contact-copy" type="button">Copy email</button>
      </div>
      <ul class="contact-links reveal"></ul>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <p class="footer-copy"></p>
      <a class="footer-top" href="#top">Back to top</a>
    </div>
  </footer>

  <div class="player" hidden role="dialog" aria-modal="true" aria-label="Video player">
    <div class="player-backdrop" data-close></div>
    <figure class="player-box">
      <video class="player-video" controls playsinline></video>
      <figcaption class="player-meta">
        <div>
          <h3 class="player-title"></h3>
          <p class="player-sub"></p>
          <p class="player-desc"></p>
        </div>
        <span class="player-count"></span>
      </figcaption>
    </figure>
    <button class="player-btn player-close" type="button" data-close aria-label="Close">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <button class="player-btn player-prev" type="button" aria-label="Previous video">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <button class="player-btn player-next" type="button" aria-label="Next video">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </div>

  <div class="toast" role="status" aria-live="polite"></div>

  <noscript><p class="noscript">This portfolio needs JavaScript to play the videos.</p></noscript>
</body>
</html>
